<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clapback</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#d9480f">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Clapback</h1>
    <p>Clap once. Hear why your room sounds the way it does.</p>
  </header>

  <main>
    <section id="step-room">
      <h2>1. The room</h2>
      <button id="btn-scan" disabled>Scan with camera (AR)</button>
      <p class="hint" id="scan-support">Checking AR support…</p>

      <form id="form-dims">
        <p>Or type the dimensions:</p>
        <label>Length (m) <input name="length" type="number" step="0.01" value="5" required></label>
        <label>Width (m) <input name="width" type="number" step="0.01" value="4" required></label>
        <label>Height (m) <input name="height" type="number" step="0.01" value="2.7" required></label>
        <button type="submit">Use these</button>
      </form>
      <pre id="room-out"></pre>
    </section>

    <section id="step-clap">
      <h2>2. Clap</h2>
      <button id="btn-record">Record a clap</button>
      <p class="hint" id="rec-status"></p>
    </section>

    <section id="step-view">
      <h2>3. Your room</h2>
      <div id="view3d"></div>
    </section>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
